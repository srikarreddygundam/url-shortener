spring:
  application:
    name: url-shortener
  datasource:
    # PostgreSQL compatibility mode keeps our SQL honest for the documented
    # production target (Postgres) while the prototype stays zero-dependency.
    url: jdbc:h2:mem:urlshortener;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates entities against it.
      ddl-auto: validate

  mvc:
    problemdetails:
      # RFC 7807 problem+json for framework-raised errors, matching our own handlers.
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  base-url: http://localhost:8080
  code-length: 7
  max-url-length: 2048
